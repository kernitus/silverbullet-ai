name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. 1.2.3)"
        required: true
      draft:
        description: "Create as draft release"
        type: boolean
        default: false
      prerelease:
        description: "Mark as prerelease"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install test dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

  release:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install production dependencies
        run: bun install --production --frozen-lockfile

      - name: Create dist files
        run: bun run dist
        env:
          RELEASE_VERSION: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' || contains(github.event.inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/silverbullet-ai.plug.js
            dist/PLUG.md
            dist/silverbullet-ai-library.md
