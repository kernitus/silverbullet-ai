name: Build and Test

on:
  workflow_dispatch:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install test dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Check Codex account service
        run: |
          bun install --cwd codex-account --frozen-lockfile
          bun run --cwd codex-account typecheck
          bun run --cwd codex-account test

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install production dependencies
        run: bun install --production --frozen-lockfile

      - name: Build
        run: bun run dist
        env:
          RELEASE_VERSION: ${{ github.ref == 'refs/heads/develop' && format('dev-{0}', github.sha) || '' }}

      - name: Upload SilverBullet distribution
        uses: actions/upload-artifact@v7
        with:
          name: silverbullet-ai-${{ github.sha }}
          path: |
            dist/silverbullet-ai.plug.js
            dist/PLUG.md
            dist/silverbullet-ai-library.md
          if-no-files-found: error
          retention-days: 30

  publish-dev:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Download tested distribution
        uses: actions/download-artifact@v8
        with:
          name: silverbullet-ai-${{ github.sha }}
          path: dist

      - name: Check that this is the current development commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/develop" --jq '.object.sha')
          if [ "$head_sha" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded build $GITHUB_SHA"
          fi

      - name: Move development tag to the tested commit
        if: steps.current.outputs.publish == 'true'
        run: |
          git tag --force dev "$GITHUB_SHA"
          git push --force origin refs/tags/dev

      - name: Publish rolling development prerelease
        if: steps.current.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev
          name: Development build
          prerelease: true
          make_latest: "false"
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            Latest tested development build: ${{ github.sha }}.

            Install through SilverBullet's Library Manager:
            `ghr:${{ github.repository }}@dev/PLUG.md`

            Use Library Manager to fetch subsequent updates.
          files: |
            dist/silverbullet-ai.plug.js
            dist/PLUG.md
            dist/silverbullet-ai-library.md
